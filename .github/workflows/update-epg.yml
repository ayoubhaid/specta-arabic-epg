name: Update Arabic EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm run scrape
      - name: Commit feed if produced
        run: |
          if [ -f data/arabic-epg.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/arabic-epg.json
            git diff --cached --quiet || git commit -m "Update Arabic EPG feed"
            git push
          else
            echo "No feed generated yet."
          fi
